<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>만세력 검증</title>
<style>body{font-family:Consolas,monospace;font-size:13px;padding:16px} .ok{color:#008845} .ng{color:#E0301E} td{padding:2px 8px}</style></head>
<body>
<h3>만세력 엔진 검증</h3>
<table id="t"></table>
<script src="../js/astro.js"></script>
<script src="../js/manse.js"></script>
<script>
var rows = [], pass = 0, fail = 0;
function fmt(d){ return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')+' '+String(d.h).padStart(2,'0')+':'+String(d.mi).padStart(2,'0'); }
function check(name, got, exp, tol){ // tol: 분 단위 허용(문자열 비교면 무시)
  var ok;
  if (typeof exp === 'number') ok = Math.abs(got - exp) <= tol; else ok = String(got) === String(exp);
  ok ? pass++ : fail++;
  rows.push('<tr class="'+(ok?'ok':'ng')+'"><td>'+(ok?'OK':'NG')+'</td><td>'+name+'</td><td>'+got+'</td><td>'+exp+'</td></tr>');
}
// 절기 (uncle.tools 2024·2026·1988 KST 기준)
var ref = {
  2024: {'소한':'2024-01-06 05:49','대한':'2024-01-20 23:07','입춘':'2024-02-04 17:27','우수':'2024-02-19 13:13','경칩':'2024-03-05 11:22','춘분':'2024-03-20 12:06','청명':'2024-04-04 16:02','곡우':'2024-04-19 22:59','입하':'2024-05-05 09:10','소만':'2024-05-20 21:59','망종':'2024-06-05 13:09','하지':'2024-06-21 05:51','소서':'2024-07-06 23:20','대서':'2024-07-22 16:44','입추':'2024-08-07 09:09','처서':'2024-08-22 23:55','백로':'2024-09-07 12:11','추분':'2024-09-22 21:43','한로':'2024-10-08 03:59','상강':'2024-10-23 07:14','입동':'2024-11-07 07:20','소설':'2024-11-22 04:56','대설':'2024-12-07 00:17','동지':'2024-12-21 18:20'},
  2026: {'소한':'2026-01-05 17:23','대한':'2026-01-20 10:44','입춘':'2026-02-04 05:02','우수':'2026-02-19 00:51','경칩':'2026-03-05 22:58','춘분':'2026-03-20 23:45','청명':'2026-04-05 03:39','곡우':'2026-04-20 10:39','입하':'2026-05-05 20:48','소만':'2026-05-21 09:36','망종':'2026-06-06 00:48','하지':'2026-06-21 17:24','소서':'2026-07-07 10:56','대서':'2026-07-23 04:13','입추':'2026-08-07 20:42','처서':'2026-08-23 11:18','백로':'2026-09-07 23:41','추분':'2026-09-23 09:05','한로':'2026-10-08 15:29','상강':'2026-10-23 18:37','입동':'2026-11-07 18:52','소설':'2026-11-22 16:23','대설':'2026-12-07 11:52','동지':'2026-12-22 05:50'},
  1988: {'소한':'1988-01-06 12:03','대한':'1988-01-21 05:24','입춘':'1988-02-04 23:42','우수':'1988-02-19 19:35','경칩':'1988-03-05 17:46','춘분':'1988-03-20 18:38','청명':'1988-04-04 22:39','곡우':'1988-04-20 05:44','입하':'1988-05-05 16:01','소만':'1988-05-21 05:56','망종':'1988-06-05 21:14','하지':'1988-06-21 13:56','소서':'1988-07-07 07:32','대서':'1988-07-23 00:51','입추':'1988-08-07 17:20','처서':'1988-08-23 07:54','백로':'1988-09-07 20:11','추분':'1988-09-23 05:28','한로':'1988-10-08 11:44','상강':'1988-10-23 13:44','입동':'1988-11-07 13:48','소설':'1988-11-22 11:11','대설':'1988-12-07 06:34','동지':'1988-12-22 00:27'}
};
var maxDiff = 0;
Object.keys(ref).forEach(function(y){
  var terms = MANSE.solarTerms(+y);
  terms.forEach(function(t){
    var exp = ref[y][t.name];
    var got = fmt(t.date);
    // 분 차이
    var e = exp.split(/[- :]/).map(Number), ej = ASTRO.jdFromDate(e[0],e[1],e[2]+(e[3]+e[4]/60)/24);
    // 1988 5/8~10/9는 참고 사이트가 서머타임(+1h) 시각으로 적어 두었으므로 되돌린다
    if (MANSE.isDst(e[0],e[1],e[2])) ej -= 1/24;
    var diff = Math.round((t.jd - ej)*1440*10)/10;
    maxDiff = Math.max(maxDiff, Math.abs(diff));
    check(y+' '+t.name+' ('+got+' / 참고 '+exp+')', diff, 0, 1.5);
  });
});
rows.push('<tr><td colspan=4>절기 최대 오차 '+maxDiff+'분</td></tr>');
// 일진
check('2000-01-01 일진', MANSE.dayGanji(ASTRO.jdFromDate(2000,1,1.5)).hanja, '戊午');
check('1900-01-01 일진', MANSE.dayGanji(ASTRO.jdFromDate(1900,1,1.5)).hanja, '甲戌');
check('2024-02-10 일진', MANSE.dayGanji(ASTRO.jdFromDate(2024,2,10.5)).hanja, '甲辰');
// 음력
function l2s(y,m,leap,d){ var r=MANSE.lunarToSolar(y,m,leap,d); return r.error||(r.y+'-'+String(r.m).padStart(2,'0')+'-'+String(r.d).padStart(2,'0')); }
function s2l(y,m,d){ var r=MANSE.solarToLunar(y,m,d); return r? r.y+'/'+(r.leap?'윤':'')+r.m+'/'+r.d : 'null'; }
check('설날 2024', l2s(2024,1,false,1), '2024-02-10');
check('설날 2025', l2s(2025,1,false,1), '2025-01-29');
check('설날 2026', l2s(2026,1,false,1), '2026-02-17');
check('설날 2027 (중국은 2/6, 한국은 삭이 KST 00:56이라 2/7)', l2s(2027,1,false,1), '2027-02-07');
check('추석 2024', l2s(2024,8,false,15), '2024-09-17');
check('추석 2025', l2s(2025,8,false,15), '2025-10-06');
check('추석 2026', l2s(2026,8,false,15), '2026-09-25');
check('윤6월 2025 1일', l2s(2025,6,true,1), '2025-07-25');
check('윤2월 2023 1일', l2s(2023,2,true,1), '2023-03-22');
check('윤4월 2020 1일', l2s(2020,4,true,1), '2020-05-23');
check('윤5월 2017 1일', l2s(2017,5,true,1), '2017-06-24');
check('윤9월 2014 1일', l2s(2014,9,true,1), '2014-10-24');
check('윤3월 2012 1일', l2s(2012,3,true,1), '2012-04-21');
check('윤5월 2009 1일', l2s(2009,5,true,1), '2009-06-23');
check('윤7월 2006 1일', l2s(2006,7,true,1), '2006-08-24');
check('윤4월 2001 1일', l2s(2001,4,true,1), '2001-05-23');
check('윤5월 1990 1일', l2s(1990,5,true,1), '1990-06-23');
check('윤10월 1984 1일', l2s(1984,10,true,1), '1984-11-23');
check('윤4월 1982 1일', l2s(1982,4,true,1), '1982-05-23');
check('윤6월 1979 1일', l2s(1979,6,true,1), '1979-07-24');
check('설날 1970', l2s(1970,1,false,1), '1970-02-06');
check('설날 1960', l2s(1960,1,false,1), '1960-01-28');
check('설날 1950', l2s(1950,1,false,1), '1950-02-17');
check('설날 1945', l2s(1945,1,false,1), '1945-02-13');
check('설날 1930', l2s(1930,1,false,1), '1930-01-30');
check('설날 1910', l2s(1910,1,false,1), '1910-02-10');
check('설날 1900', l2s(1900,1,false,1), '1900-01-31');
check('양→음 2024-09-17', s2l(2024,9,17), '2024/8/15');
check('양→음 2025-08-01', s2l(2025,8,1), '2025/윤6/8');
check('양→음 2026-01-01', s2l(2026,1,1), '2025/11/13');
check('양→음 2033-12-25 (2033문제)', s2l(2033,12,25), '2033/윤11/4');
// 사주 기둥
var p = MANSE.pillars({y:2000,m:1,d:1,h:12,mi:0,lon:null});
check('2000-01-01 12:00 사주', p.year.hanja+p.month.hanja+p.day.hanja+p.hour.hanja, '己卯丙子戊午戊午');
p = MANSE.pillars({y:2024,m:2,d:4,h:17,mi:0,lon:null});
check('2024-02-04 17:00 (입춘 17:27 전) 연월', p.year.hanja+p.month.hanja, '癸卯乙丑');
p = MANSE.pillars({y:2024,m:2,d:4,h:18,mi:0,lon:null});
check('2024-02-04 18:00 (입춘 후) 연월', p.year.hanja+p.month.hanja, '甲辰丙寅');
p = MANSE.pillars({y:1988,m:5,d:10,h:23,mi:30,lon:null});
check('1988-05-10 23:30 서머타임→22:30 시주', p.hour.branch, 11, 0);
p = MANSE.pillars({y:1990,m:7,d:15,h:0,mi:10,lon:126.98});
check('1990-07-15 00:10 서울 경도보정 → 전날 23:38 → 자시', p.hour.branch, 0, 0);
check('  같은 경우 일주 = 7/15 (23시 이후는 다음 날 일주)', p.day.hanja, MANSE.dayGanji(ASTRO.jdFromDate(1990,7,15.5)).hanja);
document.getElementById('t').innerHTML = rows.join('') + '<tr><td colspan=4><b>통과 '+pass+' / 실패 '+fail+'</b></td></tr>';
document.title = (fail? 'FAIL ' : 'PASS ') + pass + '/' + (pass+fail);
</script>
</body></html>
